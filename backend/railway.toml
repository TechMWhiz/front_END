[build]
builder = "nixpacks"
buildCommand = "sh -c 'composer install --no-dev --optimize-autoloader'"

[deploy]
startCommand = "sh -c 'php artisan serve --host=0.0.0.0 --port=${PORT:-8000}'"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[env]
APP_ENV = "production"
APP_DEBUG = "true"
APP_KEY = "base64:C+j03P67AlkEX9kZRJoXa1TKpWVrkI/hvfF03dzqVdM="
CACHE_DRIVER = "file"
SESSION_DRIVER = "file"
QUEUE_CONNECTION = "sync"
NIXPACKS_PHP_VERSION = "8.3"
