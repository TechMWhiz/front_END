[build]
builder = "nixpacks"

[deploy]
startCommand = "php artisan serve --host=0.0.0.0 --port=$PORT"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10

[env]
APP_ENV = "production"
APP_DEBUG = "false"
CACHE_DRIVER = "file"
SESSION_DRIVER = "file"
QUEUE_CONNECTION = "sync"
NIXPACKS_PHP_VERSION = "8.2"
DB_CONNECTION = "mysql"
DB_HOST = "${RAILWAY_PRIVATE_SERVICE_HOSTNAME}"
DB_PORT = "3306"
DB_DATABASE = "${RAILWAY_DATABASE_NAME}"
DB_USERNAME = "${RAILWAY_DATABASE_USERNAME}"
DB_PASSWORD = "${RAILWAY_DATABASE_PASSWORD}"
